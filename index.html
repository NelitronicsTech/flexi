<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flexi">
<meta name="theme-color" content="#EDF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Flexi – work time</title>
<style>
:root{
  --paper:#EDF0EE; --surface:#FFFFFF; --ink:#18202B; --muted:#5E6A73; --line:#D3D9D6;
  --work:#1F7A57; --work-soft:#D3EADF; --exit:#B8741A; --exit-soft:#F5E4C8;
  --off:#3B4757; --off-soft:#DDE2E8; --hol:#6B4FA0; --hol-soft:#E6DFF2;
  --danger:#B0412E; --danger-soft:#F4DCD6; --on-color:#FFFFFF;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#12171C; --surface:#1B2229; --ink:#E7ECEA; --muted:#97A3AB; --line:#2C363F;
    --work:#3FA77C; --work-soft:#1C3329; --exit:#E0A045; --exit-soft:#3A2D18;
    --off:#7F8DA0; --off-soft:#242C35; --hol:#A68BDB; --hol-soft:#2B2438;
    --danger:#E0745E; --danger-soft:#3A221D; --on-color:#0E1418;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--work);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
h1{font-size:28px;line-height:1.15;margin:4px 0 2px;font-weight:700;letter-spacing:-.01em}
h2{font-size:19px;margin:24px 0 8px;font-weight:700}
.sub{color:var(--muted);font-size:15px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

/* Header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.bal{text-align:right}
.bal b{display:block;font-size:24px;line-height:1.1}
.bal span{font-size:13px;color:var(--muted)}
.pos{color:var(--work)} .neg{color:var(--danger)}

/* Status field: the one bold element */
.field{border-radius:28px;padding:22px 22px 20px;color:var(--on-color);background:var(--off);transition:background .35s ease}
.field.working{background:var(--work)} .field.exit{background:var(--exit)} .field.done{background:var(--off)}
.field.absent{background:var(--hol)}
.field .state{font-size:17px;font-weight:600;opacity:.95}
.field .big{font-size:76px;line-height:1;font-weight:700;letter-spacing:-.03em;margin:10px 0 4px}
.field .big small{font-size:28px;opacity:.7;letter-spacing:0;margin-left:2px}
.field .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;opacity:.95}
.field .meta b{font-weight:700}

.chips{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

.actions{display:grid;gap:10px;margin-top:14px}
.btn{border:0;border-radius:18px;padding:18px;font-size:19px;font-weight:700;width:100%}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.exit{background:var(--exit-soft);color:var(--ink);border:2px solid var(--exit)}
.btn.quiet{background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:17px;padding:14px}
.btn.small{padding:10px 14px;font-size:15px;border-radius:12px;width:auto}
.btn.danger{background:var(--danger-soft);color:var(--danger);border:1.5px solid var(--danger)}
.btn:disabled{opacity:.45}

.log{margin-top:18px;background:var(--surface);border-radius:18px;padding:6px 16px}
.log div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.log div:last-child{border-bottom:0}
.log .k{color:var(--muted)}

.banner{border-radius:16px;padding:12px 14px;margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner.warn{background:var(--danger-soft);color:var(--ink);border:1.5px solid var(--danger)}
.banner.hol{background:var(--hol-soft);border:1.5px solid var(--hol)}
.banner.info{background:var(--surface);border:1.5px solid var(--line)}
.banner button{flex:none}

/* Month list */
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.monthnav button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;width:44px;height:44px;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--surface);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:22px}
.stat span{font-size:13px;color:var(--muted)}
.days{margin-top:14px;background:var(--surface);border-radius:18px;overflow:hidden}
.day{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.day:last-child{border-bottom:0}
.day .d{font-weight:700;font-size:17px;line-height:1.1}
.day .d small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.day .what{font-size:15px;min-width:0}
.day .what small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .h{text-align:right;font-weight:700}
.day .h small{display:block;font-weight:500;font-size:12px}
.day.weekend{background:var(--paper)}
.day.weekend .d,.day.weekend .what{color:var(--muted)}
.day.today{box-shadow:inset 4px 0 0 var(--work)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:13px;font-weight:600}
.tag.hol{background:var(--hol-soft);color:var(--hol)}
.tag.vac{background:var(--work-soft);color:var(--work)}
.tag.sick{background:var(--danger-soft);color:var(--danger)}
.tag.care{background:var(--exit-soft);color:var(--exit)}
.tag.other{background:var(--off-soft);color:var(--off)}
.tag.warn{background:var(--danger);color:#fff}
.lock{font-size:13px;color:var(--muted)}

/* Tables (export) */
table.sum{width:100%;border-collapse:collapse;background:var(--surface);border-radius:16px;overflow:hidden;font-size:15px}
table.sum td{padding:9px 14px;border-bottom:1px solid var(--line)}
table.sum td:last-child{text-align:right;font-weight:700}
table.sum tr.em td{background:var(--work-soft)}
table.sum tr:last-child td{border-bottom:0}

/* Forms */
.card{background:var(--surface);border-radius:18px;padding:6px 16px}
label.f{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
label.f:last-child{border-bottom:0}
label.f span{flex:1}
label.f input[type=text],label.f input[type=number],label.f select{width:52%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);text-align:right}
label.f input[type=time]{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);min-width:110px}
input[type=checkbox].sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
input[type=checkbox].sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
input[type=checkbox].sw:checked{background:var(--work)}
input[type=checkbox].sw:checked::after{transform:translateX(20px)}
.hint{font-size:13px;color:var(--muted);margin:6px 2px 0}
textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);min-height:60px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet h2{margin-top:4px}
.exitrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.exitrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--paper)}
.exitrow button{border:0;background:none;color:var(--danger);font-size:20px;padding:6px 4px;flex:none}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs div{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
nav.tabs button{border:0;background:none;padding:10px 0 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}

.toast{position:fixed;width:max-content;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 16px;display:flex;gap:16px;align-items:center;z-index:40;max-width:92vw;font-size:15px}
.toast button{border:0;background:none;color:var(--paper);font-weight:700;text-decoration:underline}
.empty{color:var(--muted);padding:12px 2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>
<div id="overlay"></div>
<input type="file" id="restoreInput" accept="application/json,.json" hidden>

<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script src="lib/pdf-fonts.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script>
"use strict";
/* =========================================================
   Flexi – personal work-time tracker (Slovenia)
   All data stays on this device (localStorage).
   ========================================================= */

const LS_KEY = "flexi.v1";
const DAY_TYPES = ["Work","Home Office","Business Trip","Vacation","Sick Leave","Child Care","Unpaid Leave"];
const CLOCK_TYPES = ["Work","Home Office","Business Trip"];
const ABSENCE_TYPES = ["Vacation","Sick Leave","Child Care","Unpaid Leave"];
const CREDITABLE = ["Vacation","Sick Leave","Child Care","Unpaid Leave"];
const TAG = {"Vacation":"vac","Sick Leave":"sick","Child Care":"care","Unpaid Leave":"other","Home Office":"other","Business Trip":"other"};
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

/* ---------- state ---------- */
function defaults(){
  return {
    settings:{ name:"", empId:"", dept:"", manager:"", std:8, vacYear:25, breakMin:0,
      credited:{"Vacation":true,"Sick Leave":true,"Child Care":true,"Unpaid Leave":false},
      holidayAdds:[], holidayRemoves:[], lastBackup:null },
    days:{}, closed:{}
  };
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaults();
    const s = JSON.parse(raw), d = defaults();
    s.settings = Object.assign(d.settings, s.settings||{});
    s.settings.credited = Object.assign(d.settings.credited, (s.settings||{}).credited||{});
    s.days = s.days||{}; s.closed = s.closed||{};
    return s;
  }catch(e){ return defaults(); }
}
let S = load();
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ toast("Could not save on this device. Free some storage and try again."); }
}
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }

/* ---------- dates & time ---------- */
const pad = n => String(n).padStart(2,"0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
const todayKey = () => keyOf(new Date());
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const hmNow = () => { const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const toMin = hm => { const [h,m] = hm.split(":").map(Number); return h*60+m; };
const nowMin = () => { const d=new Date(); return d.getHours()*60+d.getMinutes()+d.getSeconds()/60; };
const span = (a,b) => { let x = b-a; if(x<0) x+=1440; return x; };
const fmtDate = k => { const d=parseKey(k); return `${WD[d.getDay()]} ${d.getDate()}. ${d.getMonth()+1}.`; };
const fmtLong = d => `${WD[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
const monthLabel = mk => { const [y,m]=mk.split("-").map(Number); return `${MONTHS[m-1]} ${y}`; };
function hm(min){ min=Math.round(Math.abs(min)); return `${Math.floor(min/60)}:${pad(min%60)}`; }
function shm(min){ const r=Math.round(min); return (r>0?"+":r<0?"−":"")+hm(r); }
const hrs = min => Math.round(min/60*100)/100;
function addMin(hmStr, add){ let t=(toMin(hmStr)+Math.round(add))%1440; if(t<0)t+=1440; return pad(Math.floor(t/60))+":"+pad(t%60); }
function daysOfMonth(mk){ const [y,m]=mk.split("-").map(Number); const n=new Date(y,m,0).getDate(); return Array.from({length:n},(_,i)=>`${mk}-${pad(i+1)}`); }
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Slovenian work-free days ---------- */
function easter(y){ // Meeus/Jones/Butcher
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1; return new Date(y,month-1,day);
}
const holCache = {};
function baseHolidays(y){
  if(holCache[y]) return holCache[y];
  const m = {};
  [["01-01","New Year"],["01-02","New Year"],["02-08","Prešeren Day"],["04-27","Day of Uprising Against Occupation"],
   ["05-01","Labour Day"],["05-02","Labour Day"],["06-25","Statehood Day"],["08-15","Assumption Day"],
   ["10-31","Reformation Day"],["11-01","Remembrance Day"],["12-25","Christmas"],["12-26","Independence and Unity Day"]]
   .forEach(([md,n])=> m[`${y}-${md}`]=n);
  const e = easter(y);
  const add=(days,n)=>{ const d=new Date(e); d.setDate(d.getDate()+days); m[keyOf(d)]=n; };
  add(0,"Easter Sunday"); add(1,"Easter Monday"); add(49,"Whit Sunday");
  return holCache[y]=m;
}
function holidayName(k){
  if(S.settings.holidayRemoves.includes(k)) return null;
  const a = S.settings.holidayAdds.find(h=>h.date===k); if(a) return a.name||"Holiday";
  return baseHolidays(+k.slice(0,4))[k]||null;
}
function holidaysOfYear(y){
  const list = Object.entries(baseHolidays(y)).map(([date,name])=>({date,name,custom:false}));
  S.settings.holidayAdds.filter(h=>h.date.startsWith(y+"-")).forEach(h=>list.push({date:h.date,name:h.name,custom:true}));
  return list.sort((a,b)=>a.date.localeCompare(b.date));
}

/* ---------- day calculation (minutes) ---------- */
function calc(k){
  const d = S.days[k]||{}, date = parseKey(k), dow = date.getDay();
  const isToday = k===todayKey(), wd = dow>=1 && dow<=5, hol = holidayName(k);
  const std = S.settings.std*60, expected = wd ? std : 0;
  const now = isToday ? nowMin() : null;
  let gross=0, exitM=0, open=false, missing=false;
  if(d.start){
    if(d.end) gross = span(toMin(d.start), toMin(d.end));
    else if(now!=null){ gross = span(toMin(d.start), now); open=true; }
    else missing = true;
  }
  const exits = d.exits||[];
  for(const e of exits){
    if(!e.from) continue;
    if(e.to) exitM += span(toMin(e.from), toMin(e.to));
    else if(d.end) exitM += span(toMin(e.from), toMin(d.end));
    else if(now!=null) exitM += span(toMin(e.from), now);
    else missing = true;
  }
  const onExit = open && exits.length && !exits[exits.length-1].to;
  const brk = d.start ? (+d.breakMin||0) : 0;
  const worked = Math.max(0, gross - exitM - brk);
  const type = d.type || (d.start ? "Work" : "");
  let holidayCredit=0, absenceCredit=0;
  if(wd){
    if(hol) holidayCredit = std;
    else if(CREDITABLE.includes(type) && S.settings.credited[type]) absenceCredit = std;
  }
  const credited = holidayCredit + absenceCredit;
  return { k, date, wd, hol, type, expected, worked, exitM, exitCount: exits.filter(e=>e.from).length,
    holidayCredit, absenceCredit, credited, total: worked+credited, holidayWork: hol ? worked : 0,
    open, onExit, missing, isToday, d,
    absenceOnHoliday: !!(hol && wd && ABSENCE_TYPES.includes(type)) };
}
// counts toward the balance (today only once it's finished)
function settled(c){ return !(c.isToday && (c.open || (!c.d.end && !c.credited && !(c.d.start)) )); }

function monthStats(mk, uptoKey){
  const keys = daysOfMonth(mk).filter(k=>!uptoKey || k<=uptoKey);
  const st = {mk, workingDays:0, expected:0, daysWorked:0, worked:0, exits:0, exitM:0, vacation:0, sick:0, care:0,
    holidays:0, unpaid:0, holidayCredit:0, absenceCredit:0, holidayWork:0, total:0, balance:0, days:[]};
  for(const k of keys){
    const c = calc(k); st.days.push(c);
    if(uptoKey && !settled(c)) continue;
    if(c.wd){ st.workingDays++; st.expected += c.expected; }
    if(c.worked>0) st.daysWorked++;
    st.worked += c.worked; st.exits += c.exitCount; st.exitM += c.exitM;
    if(c.wd && c.hol) st.holidays++;
    if(c.wd && !c.hol){
      if(c.type==="Vacation") st.vacation++;
      if(c.type==="Sick Leave") st.sick++;
      if(c.type==="Child Care") st.care++;
      if(c.type==="Unpaid Leave") st.unpaid++;
    }
    st.holidayCredit += c.holidayCredit; st.absenceCredit += c.absenceCredit;
    st.holidayWork += c.holidayWork; st.total += c.total;
  }
  st.balance = st.total - st.expected;
  return st;
}
function yearStats(y){
  let vac=0, sick=0, care=0;
  for(let m=1;m<=12;m++){
    const mk=`${y}-${pad(m)}`;
    for(const k of daysOfMonth(mk)){
      const d=S.days[k]; if(!d||!d.type) continue;
      const c=calc(k); if(!c.wd||c.hol) continue;
      if(c.type==="Vacation") vac++; if(c.type==="Sick Leave") sick++; if(c.type==="Child Care") care++;
    }
  }
  return {vac, sick, care, vacLeft: S.settings.vacYear - vac};
}

/* ---------- UI state ---------- */
let tab = "today";
let selMonth = monthKey(new Date());
let undoSnap = null, toastTimer = null, ticker = null;

const ICONS = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>',
  month:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  export:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v6.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V12"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>'
};
function renderTabs(){
  const names = {today:"Today",month:"Month",export:"Export",settings:"Settings"};
  document.getElementById("tabs").innerHTML = Object.keys(names).map(t=>
    `<button data-tab="${t}" ${t===tab?'aria-current="page"':""}>${ICONS[t]}<span>${names[t]}</span></button>`).join("");
}
document.getElementById("tabs").addEventListener("click", e=>{
  const b=e.target.closest("button[data-tab]"); if(!b) return; tab=b.dataset.tab; render(); window.scrollTo(0,0);
});
function render(){
  renderTabs();
  clearInterval(ticker); ticker=null;
  ({today:renderToday, month:renderMonth, export:renderExport, settings:renderSettings})[tab]();
}

/* ---------- Today ---------- */
function missingDays(){
  const out=[], t=todayKey();
  Object.keys(S.days).filter(k=>k<t).sort().reverse().slice(0,40).forEach(k=>{ if(calc(k).missing) out.push(k); });
  return out;
}
function renderToday(){
  const k = todayKey(), c = calc(k), d = S.days[k]||{};
  const mk = k.slice(0,7);
  const st = monthStats(mk, k); // settled days only
  const live = c.total - c.expected;          // today's live contribution
  const balNow = st.balance + (settled(c) ? 0 : live);
  const closed = !!S.closed[mk];

  let state="off", label="Not checked in", big=c.worked, meta=[];
  if(c.onExit){ state="exit"; const e=d.exits[d.exits.length-1];
    label=`Private exit since ${e.from}`; meta.push(`Away <b>${hm(span(toMin(e.from),nowMin()))}</b>`); }
  else if(c.open){ state="working"; label=`${d.type||"Work"} since ${d.start}`; }
  else if(d.start && d.end){ state="done"; label=`Checked out at ${d.end}`; }
  else if(ABSENCE_TYPES.includes(c.type)){ state="absent"; label=c.type; }
  else if(c.hol){ state="absent"; label=c.hol; }

  if(c.open || (d.start&&d.end)){
    if(c.wd){
      const need = c.expected - c.credited - c.worked;
      if(c.open && !c.onExit && need>0) meta.push(`Full day at <b>${addMin(hmNow(), need)}</b>`);
      else if(c.open && c.onExit && need>0) meta.push(`<b>${hm(need)}</b> left today`);
      else if(need<=0) meta.push(`Full day reached`);
    }
    if(c.open){
      meta.push(`If you leave now <b>${shm(balNow)}</b>`);
      if(balNow<0 && !c.onExit) meta.push(`±0 balance at <b>${addMin(hmNow(), -balNow)}</b>`);
    }
  } else if(!d.start && c.wd && !c.credited){
    meta.push(`Today: <b>${hm(c.expected)}</b>`);
    if(Math.round(st.balance)!==0) meta.push(`Work <b>${hm(Math.max(0, c.expected - st.balance))}</b> for ±0 balance`);
  }

  const bigH = Math.floor(big/60), bigM = Math.floor(big%60);
  let banners = "";
  const miss = missingDays();
  if(miss.length) banners += `<div class="banner warn"><span>Check-out missing: <b>${fmtDate(miss[0])}</b>${miss.length>1?` and ${miss.length-1} more`:""}</span><button class="btn small quiet" data-edit="${miss[0]}">Fix</button></div>`;
  if(c.hol) banners += `<div class="banner hol"><span>Work-free day: <b>${esc(c.hol)}</b>${c.wd?` – counted as ${hm(c.expected)}`:""}</span></div>`;
  if(c.absenceOnHoliday) banners += `<div class="banner warn"><span>${esc(c.type)} is set on a holiday. The holiday counts instead, so no ${c.type.toLowerCase()} day is used.</span></div>`;
  if(!S.settings.name) banners += `<div class="banner info"><span>Add your name and ID for the accounting export.</span><button class="btn small quiet" data-go="settings">Settings</button></div>`;
  const hasData = Object.keys(S.days).length>0;
  const lb = S.settings.lastBackup ? (Date.now()-S.settings.lastBackup)/864e5 : 999;
  if(hasData && lb>14) banners += `<div class="banner info"><span>${S.settings.lastBackup?`Last backup ${Math.floor(lb)} days ago.`:"No backup yet."} Your data lives only on this phone.</span><button class="btn small quiet" data-act="backup">Back up</button></div>`;
  if(closed) banners += `<div class="banner info"><span>${monthLabel(mk)} is closed. Reopen it on the Export tab to log time.</span></div>`;

  let buttons="";
  if(!closed){
    if(c.onExit) buttons = `<button class="btn primary" data-act="back">I’m back</button><button class="btn quiet" data-act="out">Check out</button>`;
    else if(c.open) buttons = `<button class="btn primary" data-act="out">Check out</button><button class="btn exit" data-act="exit">Private exit</button>`;
    else if(d.start && d.end) buttons = `<button class="btn quiet" data-act="resume">Resume work (undo check-out)</button>`;
    else buttons = `<button class="btn primary" data-act="in">Check in</button>`;
  }
  const chipType = d.type && CLOCK_TYPES.includes(d.type) ? d.type : (d.start ? "Work" : (S._nextType||"Work"));
  const chips = (!closed && !ABSENCE_TYPES.includes(c.type)) ? `<div class="chips" role="group" aria-label="Where are you working">${CLOCK_TYPES.map(t=>
    `<button class="chip" data-type="${t}" aria-pressed="${t===chipType}">${t}</button>`).join("")}</div>` : "";

  const log = [];
  if(d.start) log.push(["Check in", d.start]);
  (d.exits||[]).forEach(e=> log.push(["Private exit", `${e.from} – ${e.to||"…"}`]));
  if(d.end) log.push(["Check out", d.end]);
  if(+d.breakMin) log.push(["Unpaid break", `${d.breakMin} min`]);

  document.getElementById("app").innerHTML = `
    <div class="top">
      <div><div class="sub">${monthLabel(mk)}</div><h1>${fmtLong(new Date())}</h1></div>
      <div class="bal"><b class="${st.balance>=0?"pos":"neg"}">${shm(st.balance)}</b><span>balance so far</span></div>
    </div>
    ${banners}
    <section class="field ${state}" aria-label="Today">
      <div class="state">${esc(label)}</div>
      <div class="big" id="bigtime">${bigH}:${pad(bigM)}<small>h</small></div>
      <div class="meta">${meta.map(m=>`<span>${m}</span>`).join("")}</div>
    </section>
    ${chips}
    <div class="actions">${buttons}
      ${!closed?`<button class="btn quiet" data-edit="${k}">Edit today / log an absence</button>`:""}
    </div>
    ${log.length?`<div class="log">${log.map(([a,b])=>`<div><span class="k">${a}</span><span>${b}</span></div>`).join("")}</div>`:""}
  `;
  if(c.open) ticker = setInterval(()=>{ if(tab==="today") renderToday(); }, 20000);
}

document.getElementById("app").addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.act) return clockAction(t.dataset.act);
  if(t.dataset.type) return setTodayType(t.dataset.type);
  if(t.dataset.edit) return openEditor(t.dataset.edit);
  if(t.dataset.go){ tab=t.dataset.go; return render(); }
  if(t.dataset.month){ selMonth = shiftMonth(selMonth, +t.dataset.month); return render(); }
  if(t.dataset.cmd) return command(t.dataset.cmd, t);
});

function snapshot(k){ undoSnap = {k, day: S.days[k] ? JSON.parse(JSON.stringify(S.days[k])) : null}; }
function clockAction(a){
  if(a==="backup") return backup();
  const k = todayKey(), now = hmNow();
  snapshot(k);
  const d = S.days[k] = S.days[k] || {};
  if(a==="in"){ d.start=now; d.end=null; d.exits=d.exits||[]; d.type = CLOCK_TYPES.includes(d.type)?d.type:(S._nextType||"Work");
    if(d.breakMin==null) d.breakMin=S.settings.breakMin; toast(`Checked in at ${now}`, true); }
  if(a==="exit"){ d.exits=d.exits||[]; d.exits.push({from:now,to:null}); toast(`Private exit at ${now}`, true); }
  if(a==="back"){ const e=d.exits[d.exits.length-1]; if(e) e.to=now; toast(`Back at ${now}`, true); }
  if(a==="out"){ const e=(d.exits||[])[d.exits.length-1]; if(e && !e.to) e.to=now; d.end=now; toast(`Checked out at ${now}`, true); }
  if(a==="resume"){ d.end=null; toast("Check-out removed – the clock is running again", true); }
  save(); render();
}
function setTodayType(t){
  const k=todayKey(); S._nextType=t;
  if(S.days[k] && S.days[k].start){ S.days[k].type=t; }
  save(); render();
}
function toast(msg, withUndo){
  clearTimeout(toastTimer);
  document.querySelectorAll(".toast").forEach(n=>n.remove());
  const n=document.createElement("div"); n.className="toast"; n.setAttribute("role","status");
  n.innerHTML=`<span>${esc(msg)}</span>${withUndo?'<button>Undo</button>':""}`;
  if(withUndo) n.querySelector("button").onclick=()=>{ if(undoSnap){ if(undoSnap.day) S.days[undoSnap.k]=undoSnap.day; else delete S.days[undoSnap.k]; undoSnap=null; save(); render(); } n.remove(); };
  document.body.appendChild(n); toastTimer=setTimeout(()=>n.remove(), 6000);
}

/* ---------- Month ---------- */
function shiftMonth(mk, n){ const [y,m]=mk.split("-").map(Number); return monthKey(new Date(y,m-1+n,1)); }
function dayRow(c){
  const d=c.d, t=c.type;
  let what="", sub="";
  if(c.hol){ what=`<span class="tag hol">${esc(c.hol)}</span>`; }
  if(t && !CLOCK_TYPES.includes(t)) what+=` <span class="tag ${TAG[t]||"other"}">${t}</span>`;
  else if(t && t!=="Work") what+=` <span class="tag other">${t}</span>`;
  if(c.missing) what+=` <span class="tag warn">No check-out</span>`;
  if(d.start) sub = `${d.start} – ${d.end || (c.open?"now":"?")}` + (c.exitCount?` · ${c.exitCount} private exit${c.exitCount>1?"s":""} (${hm(c.exitM)})`:"");
  if(d.note) sub += (sub?" · ":"")+esc(d.note);
  if(!what && !sub) what = c.wd ? `<span class="sub">–</span>` : "";
  const past = c.k<=todayKey();
  const showH = c.total>0 || (c.wd && past);
  const diff = c.total - c.expected;
  const showDiff = past && settled(c) && (c.wd || c.total>0);
  return `<button class="day ${c.wd?"":"weekend"} ${c.isToday?"today":""}" data-edit="${c.k}">
    <div class="d">${c.date.getDate()}.<small>${WD[c.date.getDay()]}</small></div>
    <div class="what">${what}${sub?`<small>${sub}</small>`:""}</div>
    <div class="h">${showH?hm(c.total):""}${showDiff?`<small class="${diff>=0?"pos":"neg"}">${shm(diff)}</small>`:""}</div>
  </button>`;
}
function renderMonth(){
  const t=todayKey(), mk=selMonth, cur = mk===t.slice(0,7), future = mk>t.slice(0,7);
  const st = monthStats(mk, cur ? t : (future?"0000":null));
  const full = monthStats(mk);
  const closed = S.closed[mk];
  document.getElementById("app").innerHTML = `
    <div class="monthnav"><button data-month="-1" aria-label="Previous month">‹</button>
      <div style="text-align:center"><h1 style="font-size:24px">${monthLabel(mk)}</h1>${closed?`<div class="lock">Closed ${new Date(closed.closedAt).toLocaleDateString("sl-SI")}</div>`:""}</div>
      <button data-month="1" aria-label="Next month">›</button></div>
    <div class="stats">
      <div class="stat"><b class="${st.balance>=0?"pos":"neg"}">${shm(st.balance)}</b><span>${cur?"Balance to date":"Month balance"}</span></div>
      <div class="stat"><b>${hm(full.total)}</b><span>of ${hm(full.expected)} expected</span></div>
      <div class="stat"><b>${hm(full.worked)}</b><span>Worked</span></div>
      <div class="stat"><b>${full.exits} · ${hm(full.exitM)}</b><span>Private exits</span></div>
      <div class="stat"><b>${full.vacation} / ${full.sick} / ${full.care}</b><span>Vacation / sick / child care days</span></div>
      <div class="stat"><b>${full.holidays} · ${hm(full.holidayCredit)}</b><span>Holidays · hours credited</span></div>
    </div>
    <div class="days">${full.days.map(dayRow).join("")}</div>
  `;
}

/* ---------- Day editor ---------- */
function openEditor(k){
  const mk=k.slice(0,7), locked=!!S.closed[mk];
  const d = JSON.parse(JSON.stringify(S.days[k]||{}));
  d.exits = d.exits||[];
  const c = calc(k);
  const ov = document.getElementById("overlay");
  const draw = ()=>{
    ov.innerHTML = `<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="Edit ${fmtDate(k)}">
      <div class="spread"><h2>${fmtLong(parseKey(k))}</h2><button class="btn small quiet" data-close="1">Close</button></div>
      ${c.hol?`<div class="banner hol"><span>Work-free day: <b>${esc(c.hol)}</b></span></div>`:""}
      ${locked?`<div class="banner info"><span>This month is closed. Reopen it on the Export tab to make changes.</span></div>`:""}
      <div class="card">
        <label class="f"><span>Day type</span><select id="e-type" ${locked?"disabled":""}>
          <option value="">${d.start?"Work":"— none —"}</option>${DAY_TYPES.map(t=>`<option ${d.type===t?"selected":""}>${t}</option>`).join("")}</select></label>
        <label class="f"><span>Check in</span><input type="time" id="e-start" value="${d.start||""}" ${locked?"disabled":""}></label>
        <label class="f"><span>Check out</span><input type="time" id="e-end" value="${d.end||""}" ${locked?"disabled":""}></label>
        <label class="f"><span>Unpaid break (min)</span><input type="number" inputmode="numeric" min="0" max="600" id="e-break" value="${+d.breakMin||0}" ${locked?"disabled":""}></label>
      </div>
      <h2>Private exits</h2>
      <div class="card" id="e-exits">${d.exits.length? d.exits.map((e,i)=>`<div class="exitrow">
          <input type="time" data-i="${i}" data-f="from" value="${e.from||""}" aria-label="Exit ${i+1} from" ${locked?"disabled":""}>
          <span>–</span><input type="time" data-i="${i}" data-f="to" value="${e.to||""}" aria-label="Exit ${i+1} back" ${locked?"disabled":""}>
          ${locked?"":`<button data-del="${i}" aria-label="Remove exit ${i+1}">✕</button>`}</div>`).join("") : `<div class="empty">None</div>`}</div>
      ${locked?"":`<button class="btn small quiet" id="e-addexit" style="margin-top:8px">Add private exit</button>`}
      <h2>Note</h2><textarea id="e-note" ${locked?"disabled":""}>${esc(d.note||"")}</textarea>
      ${locked?"":`<div class="actions"><button class="btn primary" id="e-save">Save</button>
      <button class="btn danger" id="e-clear">Clear this day</button></div>`}
    </div></div>`;
  };
  const read = ()=>{
    if(locked) return;
    d.type = ov.querySelector("#e-type").value;
    d.start = ov.querySelector("#e-start").value || null;
    d.end = ov.querySelector("#e-end").value || null;
    d.breakMin = +ov.querySelector("#e-break").value || 0;
    d.note = ov.querySelector("#e-note").value.trim();
    ov.querySelectorAll("#e-exits input").forEach(inp=>{ d.exits[+inp.dataset.i][inp.dataset.f] = inp.value || null; });
  };
  draw();
  ov.onclick = e=>{
    if(e.target.dataset.close){ ov.innerHTML=""; return; }
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.del!=null){ read(); d.exits.splice(+b.dataset.del,1); draw(); }
    if(b.id==="e-addexit"){ read(); d.exits.push({from:null,to:null}); draw(); }
    if(b.id==="e-save"){
      read();
      d.exits = d.exits.filter(x=>x.from);
      if(!d.start && d.end){ toast("Add a check-in time too."); return; }
      if(ABSENCE_TYPES.includes(d.type) && d.start && !confirm(`${d.type} with working times? The times will also count as worked hours.`)) return;
      snapshot(k);
      if(!d.type && !d.start && !d.note && !d.exits.length) delete S.days[k]; else S.days[k]=d;
      save(); ov.innerHTML=""; toast("Saved", true); render();
    }
    if(b.id==="e-clear"){ snapshot(k); delete S.days[k]; save(); ov.innerHTML=""; toast("Day cleared", true); render(); }
  };
}

/* ---------- Export ---------- */
function summaryRows(st){
  return [
    ["Working days in month (Mon–Fri)", st.workingDays, "n"],
    ["Expected hours (incl. holidays)", hrs(st.expected), "h"],
    ["Days worked", st.daysWorked, "n"],
    ["Hours worked (net of breaks & private exits)", hrs(st.worked), "h"],
    ["Private exits – count", st.exits, "n"],
    ["Private exits – hours", hrs(st.exitM), "h"],
    ["Vacation days", st.vacation, "n"],
    ["Sick leave days", st.sick, "n"],
    ["Child care days", st.care, "n"],
    ["Public holidays (work-free days)", st.holidays, "n"],
    ["Unpaid leave days", st.unpaid, "n"],
    ["Holiday hours (credited)", hrs(st.holidayCredit), "h"],
    ["Absence hours (credited)", hrs(st.absenceCredit), "h"],
    ["Hours worked on holidays", hrs(st.holidayWork), "h"],
    ["TOTAL HOURS", hrs(st.total), "h"],
    ["Balance vs. expected (overtime + / deficit −)", hrs(st.balance), "b"]
  ];
}
function renderExport(){
  const mk = selMonth, st = monthStats(mk), closed = S.closed[mk];
  const y = +mk.slice(0,4), ys = yearStats(y);
  const fmt = (v,t)=> t==="h"? v.toFixed(2) : t==="b" ? (v>0?"+":"")+v.toFixed(2) : v;
  const closedList = Object.keys(S.closed).sort().reverse();
  document.getElementById("app").innerHTML = `
    <div class="monthnav"><button data-month="-1" aria-label="Previous month">‹</button>
      <div style="text-align:center"><h1 style="font-size:24px">${monthLabel(mk)}</h1>
      <div class="lock">${closed?`Closed ${new Date(closed.closedAt).toLocaleDateString("sl-SI")}`:"Open"}</div></div>
      <button data-month="1" aria-label="Next month">›</button></div>
    <table class="sum">${summaryRows(st).map(([l,v,t],i)=>`<tr class="${i>=14?"em":""}"><td>${l}</td><td class="${t==="b"?(v>=0?"pos":"neg"):""}">${fmt(v,t)}</td></tr>`).join("")}</table>
    <div class="actions">
      ${closed
        ? `<button class="btn primary" data-cmd="both">Send PDF + Excel again</button>
           <button class="btn quiet" data-cmd="reopen">Reopen month for changes</button>`
        : `<button class="btn primary" data-cmd="close">Export &amp; close month</button>`}
      <div class="row"><button class="btn quiet" data-cmd="pdf">PDF only</button><button class="btn quiet" data-cmd="xlsx">Excel only</button></div>
    </div>
    <p class="hint">Export opens the share sheet: choose Mail, Save to Files, OneDrive and so on. Closing a month locks its days so nothing changes by accident.</p>
    <h2>${y} so far</h2>
    <div class="stats">
      <div class="stat"><b>${ys.vac} / ${S.settings.vacYear}</b><span>Vacation days used</span></div>
      <div class="stat"><b class="${ys.vacLeft>=0?"":"neg"}">${ys.vacLeft}</b><span>Vacation days left</span></div>
      <div class="stat"><b>${ys.sick}</b><span>Sick days</span></div>
      <div class="stat"><b>${ys.care}</b><span>Child care days</span></div>
    </div>
    <h2>Closed months</h2>
    ${closedList.length? `<div class="days">${closedList.map(m=>{ const s=S.closed[m].summary||{};
      return `<button class="day" data-cmd="goto" data-m="${m}"><div class="d">${m.slice(5)}.<small>${m.slice(0,4)}</small></div>
      <div class="what">${monthLabel(m)}<small>${(s.TotalHours??0).toFixed?s.TotalHours.toFixed(2):s.TotalHours} h total</small></div>
      <div class="h ${s.BalanceHours>=0?"pos":"neg"}">${s.BalanceHours>0?"+":""}${(+s.BalanceHours||0).toFixed(2)}</div></button>`;}).join("")}</div>`
      : `<p class="empty">No closed months yet. At month end, tap “Export &amp; close month”.</p>`}
  `;
}
async function command(cmd, el){
  const mk = selMonth;
  if(cmd==="goto"){ selMonth = el.dataset.m; return render(); }
  if(cmd==="reopen"){ if(confirm(`Reopen ${monthLabel(mk)}? Days become editable again. Export it again when done.`)){ delete S.closed[mk]; save(); render(); } return; }
  if(cmd==="backup") return backup();
  if(cmd==="restore") return document.getElementById("restoreInput").click();
  if(cmd==="wipe"){ if(confirm("Delete all entries and settings on this phone? Make a backup first – this cannot be undone.")){ localStorage.removeItem(LS_KEY); S=defaults(); save(); render(); } return; }
  if(cmd==="addhol") return addHoliday();
  try{
    const st = monthStats(mk), base = fileBase(mk);
    if(cmd==="pdf") await shareFiles([pdfFile(st, base)]);
    if(cmd==="xlsx") await shareFiles([xlsxFile(st, base)]);
    if(cmd==="both") await shareFiles([pdfFile(st, base), xlsxFile(st, base)]);
    if(cmd==="close"){
      const open = st.days.filter(c=>c.missing);
      if(open.length && !confirm(`${open.length} day(s) have no check-out (${fmtDate(open[0].k)}…). Close anyway?`)) return;
      const ok = await shareFiles([pdfFile(st, base), xlsxFile(st, base)]);
      if(ok===false) return;
      S.closed[mk] = {closedAt: Date.now(), summary: summaryRecord(st)};
      save(); toast(`${monthLabel(mk)} exported and closed`); render();
    }
  }catch(e){ console.error(e); toast("Export failed: "+(e.message||e)); }
}
function fileBase(mk){ const n=(S.settings.name||"Employee").trim().replace(/[\\/:*?"<>|\s]+/g,"_"); return `Timesheet_${n}_${mk}`; }
async function shareFiles(files){
  if(navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files, title: files.map(f=>f.name).join(", ")}); return true; }
    catch(e){ if(e.name==="AbortError") return false; }
  }
  for(const f of files){
    const url=URL.createObjectURL(f), a=document.createElement("a");
    a.href=url; a.download=f.name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url); a.remove();}, 4000);
  }
  return true;
}
function summaryRecord(st){
  const s=S.settings;
  return { Month: st.mk, EmployeeID: s.empId, Employee: s.name, Department: s.dept,
    WorkingDays: st.workingDays, ExpectedHours: hrs(st.expected), DaysWorked: st.daysWorked, WorkedHours: hrs(st.worked),
    PrivateExits: st.exits, PrivateExitHours: hrs(st.exitM), VacationDays: st.vacation, SickDays: st.sick,
    ChildCareDays: st.care, PublicHolidays: st.holidays, UnpaidDays: st.unpaid, HolidayHours: hrs(st.holidayCredit),
    AbsenceHours: hrs(st.absenceCredit), HolidayWorkHours: hrs(st.holidayWork), TotalHours: hrs(st.total),
    BalanceHours: hrs(st.balance), ExportedOn: new Date().toISOString().slice(0,16).replace("T"," ") };
}
const exitText = d => (d.exits||[]).filter(e=>e.from).map(e=>`${e.from}–${e.to||d.end||""}`).join(", ");

function xlsxFile(st, base){
  const s=S.settings, rec=summaryRecord(st);
  // Sheet 1: Timesheet (readable)
  const aoa = [["MONTHLY TIMESHEET"],[],["Employee",s.name],["Employee ID",s.empId],["Department",s.dept],["Period",monthLabel(st.mk)],["Standard hours/day",s.std],[],["SUMMARY"]];
  summaryRows(st).forEach(([l,v])=>aoa.push([l,v]));
  aoa.push([],["DAILY DETAIL"],["Date","Day","Type","Holiday","From","To","Private exits","Worked (h)","Credited (h)","Total (h)","Note"]);
  st.days.forEach(c=>aoa.push([c.date, WD[c.date.getDay()], c.type, c.hol||"", c.d.start||"", c.d.end||"", exitText(c.d),
    c.worked?hrs(c.worked):"", c.credited?hrs(c.credited):"", c.total?hrs(c.total):"", c.d.note||""]));
  aoa.push(["TOTAL","","","","","","",hrs(st.worked),hrs(st.credited||st.holidayCredit+st.absenceCredit),hrs(st.total)]);
  aoa.push([],["Employee signature: ____________________","","","","","Manager approval: ____________________"]);
  const ws1 = XLSX.utils.aoa_to_sheet(aoa, {cellDates:true, dateNF:"yyyy-mm-dd"});
  ws1["!cols"]=[{wch:44},{wch:6},{wch:14},{wch:24},{wch:7},{wch:7},{wch:22},{wch:10},{wch:11},{wch:9},{wch:30}];
  // Sheet 2: Daily Data (database friendly)
  const dd = st.days.map(c=>({ EmployeeID:s.empId, Employee:s.name, Month:st.mk, Date:keyOf(c.date), Type:c.type, Holiday:c.hol||"",
    Start:c.d.start||"", End:c.d.end||"", BreakMin:+c.d.breakMin||0, PrivateExits:exitText(c.d), PrivateExitHours:hrs(c.exitM),
    WorkedHours:hrs(c.worked), CreditedHours:hrs(c.credited), HolidayWorkHours:hrs(c.holidayWork), TotalHours:hrs(c.total), Note:c.d.note||"" }));
  const ws2 = XLSX.utils.json_to_sheet(dd);
  ws2["!cols"]=[10,18,9,11,14,22,7,7,9,22,16,12,13,16,11,30].map(w=>({wch:w}));
  // Sheet 3: Month Summary (one row)
  const ws3 = XLSX.utils.json_to_sheet([rec]);
  ws3["!cols"]=Object.keys(rec).map(k=>({wch:Math.max(10,k.length+2)}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws1, "Timesheet");
  XLSX.utils.book_append_sheet(wb, ws2, "Daily Data");
  XLSX.utils.book_append_sheet(wb, ws3, "Month Summary");
  const out = XLSX.write(wb, {bookType:"xlsx", type:"array"});
  return new File([out], base+".xlsx", {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

function pdfFile(st, base){
  const { jsPDF } = window.jspdf, s=S.settings;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  doc.addFileToVFS("DV.ttf", PDF_FONTS.regular); doc.addFont("DV.ttf","DV","normal");
  doc.addFileToVFS("DVB.ttf", PDF_FONTS.bold); doc.addFont("DVB.ttf","DV","bold");
  doc.setFont("DV","bold"); doc.setFontSize(15); doc.text("Monthly timesheet – "+monthLabel(st.mk), 14, 15);
  doc.setFont("DV","normal"); doc.setFontSize(9);
  doc.text(`Employee: ${s.name||"—"}    ID: ${s.empId||"—"}    Department: ${s.dept||"—"}    Standard: ${s.std} h/day`, 14, 21);
  const rows = summaryRows(st).map(([l,v,t])=>[l, t==="h"?v.toFixed(2):t==="b"?(v>0?"+":"")+v.toFixed(2):String(v)]);
  const half = Math.ceil(rows.length/2), grid=[];
  for(let i=0;i<half;i++) grid.push([...(rows[i]||["",""]), ...(rows[i+half]||["",""])]);
  doc.autoTable({ startY:25, body:grid, theme:"grid", styles:{font:"DV", fontSize:7.5, cellPadding:1.3},
    columnStyles:{0:{cellWidth:62},1:{halign:"right",fontStyle:"bold",cellWidth:22},2:{cellWidth:72},3:{halign:"right",fontStyle:"bold",cellWidth:26}},
    margin:{left:14,right:14} });
  const body = st.days.map(c=>[`${pad(c.date.getDate())}.${pad(c.date.getMonth()+1)}.`, WD[c.date.getDay()],
    [c.type, c.hol].filter(Boolean).join(" · "), c.d.start||"", c.d.end||"", exitText(c.d),
    c.worked?hrs(c.worked).toFixed(2):"", c.credited?hrs(c.credited).toFixed(2):"", c.total?hrs(c.total).toFixed(2):"", c.d.note||""]);
  body.push(["Total","","","","","",hrs(st.worked).toFixed(2),hrs(st.holidayCredit+st.absenceCredit).toFixed(2),hrs(st.total).toFixed(2),""]);
  doc.autoTable({ startY: doc.lastAutoTable.finalY+4,
    head:[["Date","Day","Type","In","Out","Private exits","Worked","Credited","Total","Note"]], body,
    theme:"grid", styles:{font:"DV", fontSize:7, cellPadding:0.9, overflow:"ellipsize"},
    headStyles:{fillColor:[24,32,43], textColor:255, fontStyle:"bold"},
    columnStyles:{0:{cellWidth:12},1:{cellWidth:9},2:{cellWidth:38},3:{cellWidth:10},4:{cellWidth:10},5:{cellWidth:28},6:{halign:"right",cellWidth:13},7:{halign:"right",cellWidth:14},8:{halign:"right",cellWidth:12},9:{cellWidth:36}},
    didParseCell: h=>{ if(h.section==="body"){ const c=st.days[h.row.index];
      if(c && !c.wd) h.cell.styles.fillColor=[238,240,238];
      if(c && c.hol) h.cell.styles.fillColor=[234,228,245];
      if(h.row.index===st.days.length){ h.cell.styles.fontStyle="bold"; h.cell.styles.fillColor=[211,234,223]; } } },
    margin:{left:14,right:14} });
  let y = Math.min(doc.lastAutoTable.finalY+14, 285);
  doc.setFontSize(8.5);
  doc.text("Employee signature: ______________________", 14, y);
  doc.text(`Manager approval${s.manager?` (${s.manager})`:""}: ______________________`, 110, y);
  doc.setFontSize(7); doc.setTextColor(120);
  doc.text(`Generated ${new Date().toLocaleString("sl-SI")} with Flexi`, 14, 292);
  return new File([doc.output("arraybuffer")], base+".pdf", {type:"application/pdf"});
}

/* ---------- Settings ---------- */
let holYear = new Date().getFullYear();
function renderSettings(){
  const s=S.settings, list=holidaysOfYear(holYear);
  const field=(id,label,type="text",extra="")=>`<label class="f"><span>${label}</span><input type="${type}" id="s-${id}" value="${esc(s[id])}" ${extra}></label>`;
  document.getElementById("app").innerHTML = `
    <h1>Settings</h1>
    <h2>You</h2>
    <div class="card">${field("name","Name")}${field("empId","Employee ID")}${field("dept","Department")}${field("manager","Approved by")}</div>
    <h2>Working time</h2>
    <div class="card">
      ${field("std","Standard hours per day","number",'step="0.25" min="1" max="12" inputmode="decimal"')}
      ${field("vacYear","Vacation days per year","number",'min="0" max="60" inputmode="numeric"')}
      ${field("breakMin","Default unpaid break (min)","number",'min="0" max="120" inputmode="numeric"')}
    </div>
    <p class="hint">In Slovenia the 30-minute daily break normally counts as working time, so the unpaid break usually stays at 0.</p>
    <h2>Credited with standard hours</h2>
    <div class="card">${CREDITABLE.map(t=>`<label class="f"><span>${t}</span><input type="checkbox" class="sw" data-cred="${t}" ${s.credited[t]?"checked":""}></label>`).join("")}</div>
    <p class="hint">Work-free days on Monday–Friday are always credited and count in expected hours.</p>
    <div class="spread"><h2>Work-free days ${holYear}</h2><div class="row"><button class="btn small quiet" data-cmd="holprev" aria-label="Previous year">‹</button><button class="btn small quiet" data-cmd="holnext" aria-label="Next year">›</button></div></div>
    <div class="card">${list.map(h=>{ const off=s.holidayRemoves.includes(h.date);
      return `<label class="f"><span>${fmtDate(h.date)} ${h.date.slice(0,4)} – ${esc(h.name)}${h.custom?" (added)":""}</span>
      <input type="checkbox" class="sw" data-hol="${h.date}" data-custom="${h.custom?1:""}" ${off?"":"checked"} aria-label="${esc(h.name)} on"></label>`;}).join("")}</div>
    <button class="btn small quiet" data-cmd="addhol" style="margin-top:8px">Add a work-free day</button>
    <p class="hint">Slovenian work-free days are filled in automatically, including Easter Monday. Switch one off or add one if the law changes.</p>
    <h2>Backup</h2>
    <div class="card"><div class="spread" style="padding:12px 0"><span>Last backup</span><b>${s.lastBackup?new Date(s.lastBackup).toLocaleDateString("sl-SI"):"never"}</b></div></div>
    <div class="actions">
      <button class="btn primary" data-cmd="backup">Save backup file</button>
      <button class="btn quiet" data-cmd="restore">Restore from backup</button>
      <button class="btn danger" data-cmd="wipe">Delete all data on this phone</button>
    </div>
    <p class="hint">Everything is stored only on this phone. Save a backup to iCloud Drive or OneDrive every couple of weeks.</p>
  `;
  const app=document.getElementById("app");
  app.querySelectorAll("input[id^=s-]").forEach(inp=> inp.onchange=()=>{
    const id=inp.id.slice(2); s[id] = inp.type==="number" ? (+inp.value||0) : inp.value.trim(); save();
  });
  app.querySelectorAll("[data-cred]").forEach(inp=> inp.onchange=()=>{ s.credited[inp.dataset.cred]=inp.checked; save(); });
  app.querySelectorAll("[data-hol]").forEach(inp=> inp.onchange=()=>{
    const d=inp.dataset.hol;
    if(inp.dataset.custom && !inp.checked){ s.holidayAdds = s.holidayAdds.filter(h=>h.date!==d); }
    else if(inp.checked) s.holidayRemoves = s.holidayRemoves.filter(x=>x!==d);
    else s.holidayRemoves.push(d);
    save(); renderSettings();
  });
  app.querySelector('[data-cmd="holprev"]').onclick=e=>{ e.stopPropagation(); holYear--; renderSettings(); };
  app.querySelector('[data-cmd="holnext"]').onclick=e=>{ e.stopPropagation(); holYear++; renderSettings(); };
}
function addHoliday(){
  const date = prompt("Date of the work-free day (YYYY-MM-DD):", `${holYear}-`);
  if(!date) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || isNaN(parseKey(date))){ toast("Use the format YYYY-MM-DD, for example 2027-06-08."); return; }
  const name = prompt("Name:", "Holiday") || "Holiday";
  S.settings.holidayAdds.push({date, name}); S.settings.holidayRemoves = S.settings.holidayRemoves.filter(x=>x!==date);
  save(); render();
}
async function backup(){
  const blob = new File([JSON.stringify({app:"flexi", version:1, savedAt:new Date().toISOString(), data:S}, null, 1)],
    `Flexi_backup_${todayKey()}.json`, {type:"application/json"});
  const ok = await shareFiles([blob]);
  if(ok!==false){ S.settings.lastBackup = Date.now(); save(); toast("Backup saved"); render(); }
}
document.getElementById("restoreInput").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const j=JSON.parse(await f.text());
    if(j.app!=="flexi" || !j.data || !j.data.days) throw new Error("not a Flexi backup");
    const n=Object.keys(j.data.days).length;
    if(!confirm(`Replace the data on this phone with the backup from ${String(j.savedAt||"").slice(0,10)} (${n} days)?`)) return;
    localStorage.setItem(LS_KEY, JSON.stringify(j.data)); S=load(); toast("Backup restored"); render();
  }catch(err){ toast("This file isn’t a Flexi backup. Choose a file named Flexi_backup_….json."); }
});

/* ---------- start ---------- */
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) render(); });
render();
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
